name: busca
# 5h23 em Fortaleza (08:23 UTC): coleta, pontua, grava no D1 e monta a lista. O Worker manda às 8h.
# Minuto quebrado porque o GitHub descarta agendamentos na hora cheia quando está cheio.
# Se mesmo assim não rodar, o Worker dispara a busca às 8h.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "busca | dry-run (só contagens, sem gravar) | lista (refaz a lista de hoje) | teste-ia"
        default: busca
        type: choice
        options: [busca, dry-run, lista, teste-ia]
permissions:
  contents: read
concurrency:
  group: busca
  cancel-in-progress: false
jobs:
  busca:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Rodar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ inputs.modo || 'busca' }}
        run: |
          case "$MODO" in
            dry-run) python -m engine busca --dry-run ;;
            lista)   python -m engine busca --no-collect --force-list ;;
            teste-ia) python -m engine teste-ia ;;
            *)       python -m engine busca ;;
          esac
