<!DOCTYPE html><html><head><title>Apply - Acme</title></head><body>
<form id="application" onsubmit="event.preventDefault(); document.body.innerHTML='<h1>Thank you for applying! Your application has been submitted.</h1>';">
<label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
<label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
<label for="email">Email *</label><input id="email" type="email" required>
<label for="phone">Phone</label><input id="phone" type="tel">
<label for="resume">Resume/CV *</label><input id="resume" type="file" required>
<label for="li">LinkedIn Profile</label><input id="li">
<label for="cur">Current Company</label><input id="cur">
<label for="auth">Are you legally authorized to work in the United States? *</label>
<select id="auth" required><option>Select...</option><option>Yes</option><option>No</option></select>
<fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
<label><input type="radio" name="sp" value="1" required>Yes</label><label><input type="radio" name="sp" value="0">No</label></fieldset>
<label for="sal">What are your salary expectations?</label><input id="sal">
<label for="cl">Cover Letter</label><textarea id="cl"></textarea>
<label for="gender">Gender</label><select id="gender"><option></option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select>
<label><input type="checkbox" id="priv" required> I agree to the privacy policy *</label>
EXTRA
<button type="submit">Submit application</button>
</form></body></html>
