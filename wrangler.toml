name = "robo-de-vagas"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
PANEL_URL = "https://robo-de-vagas-painel.pages.dev"
GH_REPO = "Victorvkdev/robo-de-vagas"

[[d1_databases]]
binding = "DB"
database_name = "robo-de-vagas"
database_id = "c607d58c-1550-4341-b749-c505ab72750b"
migrations_dir = "migrations"

# A cada 15 min: lembretes de entrevista (24h e 1h), fila do silêncio (sai às 7h) e,
# das 8h às 11h59 (Fortaleza, UTC-3), a lista do dia assim que a busca das 6h terminar.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
